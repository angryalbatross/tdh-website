# Contact form
[params.contact]
    buttonText = "Request a Consultation"
    thanks = "Thanks — we received your request and will respond within one business day."
    error  = "Message could not be sent. Please try again shortly."

[params.contact.form.name]
    text = "Full Name *"
    warning = "Please enter your name."

[params.contact.form.email]
    text = "Email *"
    warning = "Please enter a valid email."

[params.contact.form.phone]
    text = "Phone (optional)"
    warning = "Please enter a valid phone number."

[params.contact.form.message]
    text = "Tell us about your property and what you're looking for *"
    warning = "Please add a short message."

# Portfolio
[params.portfolio]
    enable = true
    title = "Selected Projects"
    subtitle = "A sampling of container gardens, commercial planters, and seasonal installations across East Texas."

    [params.portfolio.modal]
        buttonText = "Close"

[markup.goldmark.renderer]
    unsafe = true
