baseURL = "https://tdhort.com/"
languageCode = "en-us"
title = "Third Day Horticulture | Container Gardens & Commercial Planters in Tyler, TX"
theme = "minimal"
enableRobotsTXT = true

[params]
    author = "Third Day Horticulture"
    description = "Third Day Horticulture designs, installs, and maintains premium container gardens, commercial planters, and seasonal planter rotations for businesses, medical facilities, country clubs, and homes across Tyler and East Texas."
    tagline = "Premium container gardens and commercial planters for Tyler & East Texas."
    city = "Tyler"
    region = "Texas"
    regionCode = "TX"
    serviceArea = "Tyler, Longview, Lindale, Whitehouse, Bullard, Flint, and greater East Texas"
    ogImage = "img/portfolio/GLWP8758.JPG"
    font = "Inter"
    accent = "#2f5d3a"

