name: Deploy to Production

# Builds the site and pushes the output to the production GitHub Pages
# repo (3rdDayHort/3rdDayHort.github.io) whenever `master` is updated.
# CloudFront sits in front of that Pages origin for tdhort.com.
#
# One-time setup (required before the first run):
#   1. Create a fine-grained Personal Access Token (or Deploy Key) with
#      *push* access to 3rdDayHort/3rdDayHort.github.io.
#   2. Add it to this repo's Settings → Secrets and variables → Actions
#      as PROD_DEPLOY_TOKEN.
#
# After merging into master, this workflow:
#   - Builds the Hugo site with the production baseURL (https://tdhort.com/).
#   - Force-updates `master` on 3rdDayHort/3rdDayHort.github.io so its
#     repo root is exactly the built `public/` directory.
#   - GitHub Pages rebuilds automatically. CloudFront may still serve
#     cached content until its TTL expires (or you invalidate manually).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROD_REPO: 3rdDayHort/3rdDayHort.github.io
  PROD_BRANCH: master
  PROD_BASE_URL: https://tdhort.com/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Verify deploy token is present
        run: |
          if [ -z "${{ secrets.PROD_DEPLOY_TOKEN }}" ]; then
            echo "::error ::PROD_DEPLOY_TOKEN secret is not set. See this workflow's comments for setup instructions."
            exit 1
          fi

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.123.7"
          extended: true

      - name: Build site
        run: |
          rm -rf public
          hugo --minify --baseURL "${{ env.PROD_BASE_URL }}"
          # Safety nets for GitHub Pages static hosting.
          touch public/.nojekyll

      - name: Push built site to production repo
        env:
          TOKEN: ${{ secrets.PROD_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          cd "$WORK"
          git clone --depth=1 --branch "${PROD_BRANCH}" \
            "https://x-access-token:${TOKEN}@github.com/${PROD_REPO}.git" prod
          cd prod

          # Replace repo contents with the newly built site.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE"/public/. .

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA:0:7}"
          git commit -m "Deploy from ${GITHUB_REPOSITORY}@${SHORT_SHA}"
          git push origin "${PROD_BRANCH}"
